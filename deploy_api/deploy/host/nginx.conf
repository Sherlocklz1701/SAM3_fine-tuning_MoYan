# 80 → 强制跳 HTTPS
server {
    listen 80;
    server_name api.example.com;   # 改成你的域名/主机名

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;   # 改成你的域名

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;      # 单图 ≤20MB，留余量

    location /segment {
        proxy_pass http://segment-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key $http_x_api_key;   # 显式透传密钥头
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /healthz { proxy_pass http://segment-api:8000; }
    location /readyz  { proxy_pass http://segment-api:8000; }
}
